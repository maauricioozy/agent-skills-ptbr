name: Relatar problema
description: Informe um comportamento reproduzível de uma skill.
title: "[bug] "
labels:
  - bug
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - caprichar
        - deep-research
        - humanizar-pt
        - pacote ou instalação
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Pedido usado
      description: Remova dados privados antes de colar.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Agente e versão
      placeholder: Codex, Claude Code ou outro agente compatível
